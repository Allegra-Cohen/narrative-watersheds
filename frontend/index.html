<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narrative Watersheds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="map-area">
        <div class="landmark-palette" id="landmark-palette">
            <button class="palette-btn" data-icon="castle" title="Castle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 20 L3 11 L5 11 L5 9 L7 9 L7 11 L9 11 L9 8 L11 8 L11 6 L13 6 L13 8 L15 8 L15 11 L17 11 L17 9 L19 9 L19 11 L21 11 L21 20 Z" />
                    <path d="M11 20 L11 15 L13 15 L13 20" />
                </svg>
            </button>
            <button class="palette-btn" data-icon="city" title="City">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 20 L2 12 L6 12 L6 8 L10 8 L10 4 L14 4 L14 10 L18 10 L18 14 L22 14 L22 20 Z" />
                </svg>
            </button>
            <button class="palette-btn" data-icon="town" title="Town">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 20 L3 14 L7 10 L11 14 L11 20 Z" />
                    <path d="M12 20 L12 13 L16 9 L20 13 L20 20 Z" />
                </svg>
            </button>
            <button class="palette-btn" data-icon="bridge" title="Bridge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 17 Q12 6 22 17" />
                    <path d="M2 17 L2 19 L22 19 L22 17" />
                    <path d="M7 19 L7 22" />
                    <path d="M17 19 L17 22" />
                </svg>
            </button>
            <button class="palette-btn" data-icon="lighthouse" title="Lighthouse">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 22 L10 8 L14 8 L15 22 Z" />
                    <path d="M8 8 L16 8 L16 6 L8 6 Z" />
                    <path d="M10 6 L10 4 L14 4 L14 6" />
                    <path d="M12 4 L12 2" />
                </svg>
            </button>
        </div>

        <div class="landmark-popup-backdrop" id="landmark-popup-backdrop" hidden>
            <div class="landmark-popup" role="dialog" aria-modal="true">
                <header class="landmark-popup-header">
                    <div class="landmark-popup-icon" id="landmark-popup-icon"></div>
                    <button class="doc-popup-close" id="landmark-popup-close" title="Close (Esc)">×</button>
                </header>
                <div class="landmark-popup-body">
                    <textarea class="landmark-thoughts" id="landmark-thoughts" placeholder="What does this place mean?"></textarea>
                </div>
                <footer class="landmark-popup-footer">
                    <button class="landmark-delete-btn" id="landmark-delete-btn">Delete</button>
                    <button class="landmark-confirm-btn" id="landmark-confirm-btn" hidden>Confirm</button>
                    <span class="landmark-save-status" id="landmark-save-status"></span>
                </footer>
            </div>
        </div>

        <div class="doc-popup-backdrop" id="doc-popup-backdrop" hidden>
            <div class="doc-popup" id="doc-popup" role="dialog" aria-modal="true">
                <header class="doc-popup-header">
                    <div class="doc-popup-titles">
                        <h2 class="doc-popup-title"></h2>
                        <p class="doc-popup-meta"></p>
                    </div>
                    <button class="doc-popup-close" id="doc-popup-close" title="Close (Esc)">×</button>
                </header>
                <div class="doc-popup-body">
                    <pre class="doc-popup-text"></pre>
                </div>
            </div>
        </div>
        <svg class="map-canvas" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <circle cx="1" cy="1" r="1" fill="#947450" fill-opacity="0.35" />
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid)" />
        </svg>
        <div class="map-tooltip" id="map-tooltip" hidden></div>
        <div class="stage-toggle">
            <button class="stage-btn active" data-view="world">Your world</button>
            <button class="stage-btn" data-view="path" disabled>Your path</button>
        </div>
    </main>

    <div class="resize-handle" id="resize-handle" title="Drag to resize"></div>

    <aside class="side-column">
        <section class="panel documents-panel">
            <header class="panel-header">
                <span class="panel-title">DOCUMENTS</span>
                <div class="panel-actions">
                    <button class="panel-action" id="upload-files-btn" title="Upload files">+ files</button>
                    <button class="panel-action" id="upload-folder-btn" title="Upload folder">+ folder</button>
                </div>
            </header>
            <div class="panel-body">
                <div class="docs-list" id="docs-list">
                    <p class="empty-state">No documents yet.</p>
                </div>
            </div>
            <input type="file" id="files-input" multiple hidden
                   accept=".pdf,.html,.htm,.md,.markdown,.txt">
            <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
        </section>

        <section class="panel essay-panel">
            <header class="panel-header">
                <span class="panel-title">ESSAY</span>
                <div class="panel-actions">
                    <button class="panel-action" id="trace-path-btn">trace path</button>
                </div>
            </header>
            <div class="panel-body">
                <textarea class="essay-editor" placeholder="# Working title&#10;&#10;Start writing…"></textarea>
            </div>
        </section>

    </aside>

    <script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6"></script>
    <script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>
    <script src="app.js"></script>
    <script src="map.js"></script>
</body>
</html>
